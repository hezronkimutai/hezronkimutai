<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Posts</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml/dist/js-yaml.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            color: #333;
        }
        .blog-post {
            margin-bottom: 2rem;
            padding: 1rem;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        .metadata {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
        }
        .tags {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .tag {
            background: #f0f0f0;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.8rem;
        }
        pre {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
        }
        code {
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>
    <h1>Blog Posts</h1>
    <div id="blog-posts"></div>

    <script>
        async function loadBlogPost(filename) {
            const response = await fetch(filename);
            const text = await response.text();
            
            // Split frontmatter and content
            const parts = text.split('---\n');
            if (parts.length < 3) return null;
            
            // Parse frontmatter
            const frontmatter = jsyaml.load(parts[1]);
            const content = parts.slice(2).join('---\n');
            
            return {
                metadata: frontmatter,
                content: content
            };
        }

        async function displayBlogPost(filename) {
            const post = await loadBlogPost(filename);
            if (!post) return;

            const container = document.getElementById('blog-posts');
            const postElement = document.createElement('article');
            postElement.className = 'blog-post';

            const metadata = `
                <div class="metadata">
                    <strong>${post.metadata.author}</strong> • 
                    ${new Date(post.metadata.date).toLocaleDateString()}
                </div>
            `;

            const tags = `
                <div class="tags">
                    ${post.metadata.tags.map(tag => `
                        <span class="tag">${tag}</span>
                    `).join('')}
                </div>
            `;

            postElement.innerHTML = `
                <h2>${post.metadata.title}</h2>
                ${metadata}
                <div class="content">
                    ${marked.parse(post.content)}
                </div>
                ${tags}
            `;

            container.appendChild(postElement);
        }

        // Load test blog post
        displayBlogPost('test-blog.md');
    </script>
</body>
</html>
